<section id="home" class="hero">
  <div class="container hero-content">
    <div class="hero-photo">
      <img src="assets/img/foto_personal.webp" alt="Bryan Rodriguez" class="hero-img" width="640" height="640" fetchpriority="high" />
    </div>
    <div class="hero-info">
      <h1 class="hero-title">
        <span>{{ langService.translate('hero.title') }}</span>
        <span class="hero-name">Bryan Rodriguez</span>
      </h1>
      <p class="hero-subtitle"><span #typedElement></span></p>
      <p class="hero-description">{{ langService.translate('hero.description') }}</p>
      <div class="hero-buttons">
        <a href="#projects" class="btn">{{ langService.translate('hero.viewProjects') }}</a>
        <a href="assets/cv.pdf" download class="btn">{{ langService.translate('hero.downloadCV') }}</a>
      </div>
    </div>
  </div>
</section>
